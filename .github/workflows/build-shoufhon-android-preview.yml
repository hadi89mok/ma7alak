name: Build ShoufHon Android Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "shoufhon-app/**"
      - ".github/workflows/build-shoufhon-android-preview.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shoufhon-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Generate ShoufHon Android icon and splash assets
        run: |
          npx @capacitor/assets generate --android             --iconBackgroundColor "#090503"             --iconBackgroundColorDark "#090503"             --splashBackgroundColor "#090503"             --splashBackgroundColorDark "#090503"

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload ShoufHon APK
        uses: actions/upload-artifact@v4
        with:
          name: ShoufHon-Android-Debug
          path: shoufhon-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
