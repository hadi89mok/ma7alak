<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ShoufHon Live Test</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:#050505;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%;overscroll-behavior:none}
    body{min-height:100dvh}
    button,input{font:inherit}
    button{cursor:pointer}
    .app{width:min(100%,760px);min-height:100dvh;margin:0 auto;padding:12px 12px calc(18px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
    .brand{font-size:22px;font-weight:950;letter-spacing:.1px}
    .top-pills{display:flex;gap:7px;align-items:center}
    .pill{display:flex;align-items:center;gap:5px;min-height:31px;padding:0 9px;border:1px solid #292929;background:#111;border-radius:999px;font-size:12px;font-weight:850}
    .quality-dot{width:8px;height:8px;border-radius:50%;background:#666}
    .stage{position:relative;width:100%;background:#0d0d0d;border:1px solid #222;border-radius:22px;overflow:hidden;aspect-ratio:9/16;max-height:73dvh;box-shadow:0 16px 50px rgba(0,0,0,.32)}
    #local,#remote{position:absolute;inset:0;width:100%;height:100%;background:#080808}
    #local>div,#remote>div{width:100%!important;height:100%!important}
    #local video,#remote video{width:100%!important;height:100%!important;object-fit:cover!important}
    #local.mirror video{transform:scaleX(-1)!important}
    .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.3),transparent 23%,transparent 65%,rgba(0,0,0,.68))}
    .live-badge{position:absolute;top:12px;left:12px;z-index:8;background:#e11d48;color:#fff;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:950;display:none;box-shadow:0 6px 20px rgba(225,29,72,.35)}
    .viewers{position:absolute;top:12px;right:12px;z-index:8;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;display:none}
    .status{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;background:rgba(0,0,0,.62);backdrop-filter:blur(12px);padding:9px 11px;border:1px solid rgba(255,255,255,.08);border-radius:12px;font-size:12px;font-weight:700}
    .floating-controls{position:absolute;right:10px;top:55px;z-index:10;display:none;flex-direction:column;gap:8px}
    .round{width:45px;height:45px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(8,8,8,.62);backdrop-filter:blur(10px);color:#fff;font-size:19px;display:grid;place-items:center}
    .round.active{background:#fff;color:#111}
    .round.danger{background:#c61d39}
    .join-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}
    .big{appearance:none;border:0;border-radius:15px;min-height:54px;padding:12px 14px;font-weight:950;font-size:16px}
    .host{background:#ef334f;color:#fff}
    .watch{background:#fff;color:#111}
    .host-panel,.viewer-panel{display:none;margin-top:10px}
    .control-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .ctrl{border:1px solid #262626;background:#111;color:#fff;border-radius:14px;min-height:58px;font-size:11px;font-weight:850;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
    .ctrl span:first-child{font-size:20px}
    .ctrl.on{background:#f2f2f2;color:#111}
    .ctrl.end{background:#b91c38;border-color:#b91c38}
    .chat{display:none;margin-top:10px;border:1px solid #222;background:#0e0e0e;border-radius:16px;overflow:hidden}
    .chat-list{height:130px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
    .msg{max-width:86%;padding:7px 9px;border-radius:11px;background:#191919;font-size:12px;line-height:1.35}
    .msg.me{align-self:flex-end;background:#2b2b2b}
    .msg b{font-size:10px;color:#aaa;display:block;margin-bottom:2px}
    .chat-send{display:grid;grid-template-columns:1fr auto auto;border-top:1px solid #222}
    .chat-send input{min-width:0;border:0;outline:0;background:#111;color:#fff;padding:12px;font-size:14px}
    .chat-send button{border:0;background:#fff;color:#111;font-weight:950;padding:0 14px}
    .heart-btn{background:#111!important;color:#ff4d72!important;font-size:20px!important}
    .heart{position:absolute;z-index:30;right:24px;bottom:78px;font-size:28px;pointer-events:none;animation:floatHeart 1.7s ease-out forwards}
    @keyframes floatHeart{0%{opacity:0;transform:translateY(10px) scale(.75)}15%{opacity:1}100%{opacity:0;transform:translateY(-170px) scale(1.35) rotate(12deg)}}
    .note{color:#777;font-size:11px;line-height:1.4;margin:9px 2px 0}
    .hidden{display:none!important}
    @media(max-width:520px){
      .app{padding:8px 8px calc(14px + env(safe-area-inset-bottom))}
      .topbar{margin-top:max(2px,env(safe-area-inset-top))}
      .stage{border-radius:18px;max-height:none}
      .brand{font-size:20px}
      .control-grid{gap:6px}
      .ctrl{border-radius:12px}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <div class="brand">ShoufHon Live</div>
    <div class="top-pills">
      <div class="pill"><span class="quality-dot" id="qualityDot"></span><span id="qualityText">Offline</span></div>
      <div class="pill" id="viewerPill">👥 <span id="viewerCountTop">0</span></div>
    </div>
  </div>

  <section class="stage" id="stage">
    <div id="local"></div>
    <div id="remote"></div>
    <div class="shade"></div>
    <div id="badge" class="live-badge">● LIVE</div>
    <div id="viewers" class="viewers">👥 <span id="viewerCount">0</span></div>
    <div id="status" class="status">Ready. Phone: Go Live · PC: Watch Live</div>

    <div id="floatingControls" class="floating-controls">
      <button id="switchCamFloat" class="round" title="Switch camera">🔄</button>
      <button id="muteFloat" class="round" title="Mute microphone">🎤</button>
      <button id="pauseFloat" class="round" title="Pause camera">🎥</button>
      <button id="torchFloat" class="round" title="Torch">🔦</button>
      <button id="fullscreenFloat" class="round" title="Fullscreen">⛶</button>
    </div>
  </section>

  <div id="joinActions" class="join-actions">
    <button id="hostBtn" class="big host">🔴 GO LIVE</button>
    <button id="watchBtn" class="big watch">👀 WATCH LIVE</button>
  </div>

  <div id="hostPanel" class="host-panel">
    <div class="control-grid">
      <button id="switchBtn" class="ctrl"><span>🔄</span><span>Switch camera</span></button>
      <button id="muteBtn" class="ctrl"><span>🎤</span><span>Mute</span></button>
      <button id="pauseBtn" class="ctrl"><span>🎥</span><span>Pause video</span></button>
      <button id="torchBtn" class="ctrl"><span>🔦</span><span>Flash</span></button>
      <button id="fullscreenBtn" class="ctrl"><span>⛶</span><span>Fullscreen</span></button>
      <button id="heartHostBtn" class="ctrl"><span>❤️</span><span>Heart</span></button>
      <button id="qualityBtn" class="ctrl"><span>📶</span><span id="qualityBtnText">Auto 720p</span></button>
      <button id="endBtn" class="ctrl end"><span>⏹</span><span>End Live</span></button>
    </div>
  </div>

  <div id="viewerPanel" class="viewer-panel">
    <div class="control-grid">
      <button id="heartViewerBtn" class="ctrl"><span>❤️</span><span>Send heart</span></button>
      <button id="fullscreenViewerBtn" class="ctrl"><span>⛶</span><span>Fullscreen</span></button>
    </div>
  </div>

  <div id="chat" class="chat">
    <div id="chatList" class="chat-list"></div>
    <div class="chat-send">
      <input id="chatInput" maxlength="160" placeholder="Write a message…">
      <button id="heartChatBtn" class="heart-btn">❤️</button>
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="note">Temporary Agora test. Production will use secure server-generated tokens; this test token expires automatically.</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/agora-rtc-sdk-ng@4.24.8/AgoraRTC_N-production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const APP_ID="9f6a0618a20e4cecb534969714768475";
const TOKEN="007eJxTYFj0JeHi9sPPMhSkjRVmBFd7+x2e+Pjr1VlbZTbIWDvqTK5TYLBMM0s0MDO0SDQySDVJTk1OMjU2sTSzNDc0MTezMDE3DaramtUQyMiQ9VSDkZEBAkF8IYbijPzStIz8PN2czLJU3ZLU4hIGBgBQCySy";
const CHANNEL="shoufhon-live-test";
const SUPABASE_URL="https://wdtaiuwtqdepzdamgsrs.supabase.co";
const SUPABASE_KEY="sb_publishable_lzog5ZX19HK5_rFfer8Ylw_OPG_0bXl";
const RT_TOPIC="shoufhon-live-test-v2";

const $=id=>document.getElementById(id);
const els={
  status:$("status"),badge:$("badge"),viewers:$("viewers"),viewerCount:$("viewerCount"),viewerCountTop:$("viewerCountTop"),
  qualityDot:$("qualityDot"),qualityText:$("qualityText"),qualityBtnText:$("qualityBtnText"),
  local:$("local"),remote:$("remote"),stage:$("stage"),joinActions:$("joinActions"),hostPanel:$("hostPanel"),viewerPanel:$("viewerPanel"),
  floatingControls:$("floatingControls"),chat:$("chat"),chatList:$("chatList"),chatInput:$("chatInput")
};

let client=null,localAudioTrack=null,localVideoTrack=null,role=null;
let micMuted=false,videoPaused=false,torchOn=false,cameraFacing="environment";
let joinedWanted=false,wakeLock=null,realtimeChannel=null;
let qualityProfile="720p_3",lastQualityChange=0;
let clientId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,"").slice(0,16);
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function setStatus(x){els.status.textContent=x}
function setQuality(label,color){els.qualityText.textContent=label;els.qualityDot.style.background=color}
function joinedUI(mode){
  const joined=!!mode;
  els.joinActions.style.display=joined?"none":"grid";
  els.hostPanel.style.display=mode==="host"?"block":"none";
  els.viewerPanel.style.display=mode==="audience"?"block":"none";
  els.floatingControls.style.display=mode==="host"?"flex":"none";
  els.chat.style.display=joined?"block":"none";
  els.badge.style.display=joined?"block":"none";
  els.viewers.style.display=joined?"block":"none";
}
function updateViewerCount(){
  if(!realtimeChannel) return;
  const state=realtimeChannel.presenceState();
  let count=0;
  Object.values(state).flat().forEach(p=>{if(p&&p.role==="audience") count++});
  els.viewerCount.textContent=String(count);
  els.viewerCountTop.textContent=String(count);
}
function addMessage(name,text,self=false){
  if(!text) return;
  const d=document.createElement("div");
  d.className="msg"+(self?" me":"");
  const b=document.createElement("b");b.textContent=name||"Viewer";
  const s=document.createElement("span");s.textContent=text;
  d.append(b,s);els.chatList.appendChild(d);
  els.chatList.scrollTop=els.chatList.scrollHeight;
  while(els.chatList.children.length>60) els.chatList.firstChild.remove();
}
function spawnHeart(){
  const h=document.createElement("div");
  h.className="heart";h.textContent=["❤️","💛","💚","💙","💜"][Math.floor(Math.random()*5)];
  h.style.right=(18+Math.random()*80)+"px";
  els.stage.appendChild(h);
  setTimeout(()=>h.remove(),1800);
}
async function setupRealtime(nextRole){
  if(realtimeChannel){try{await supa.removeChannel(realtimeChannel)}catch(_){}}
  realtimeChannel=supa.channel(RT_TOPIC,{config:{presence:{key:clientId},broadcast:{self:true}}});
  realtimeChannel
    .on("presence",{event:"sync"},updateViewerCount)
    .on("broadcast",{event:"chat"},({payload})=>addMessage(payload.name,payload.text,payload.sender===clientId))
    .on("broadcast",{event:"heart"},()=>spawnHeart())
    .on("broadcast",{event:"live-ended"},()=>{if(role==="audience") setStatus("Live ended by host.");})
    .subscribe(async status=>{
      if(status==="SUBSCRIBED"){
        await realtimeChannel.track({role:nextRole,joined_at:new Date().toISOString()});
        updateViewerCount();
      }
    });
}
async function sendChat(){
  const text=els.chatInput.value.trim();
  if(!text||!realtimeChannel) return;
  els.chatInput.value="";
  await realtimeChannel.send({type:"broadcast",event:"chat",payload:{sender:clientId,name:role==="host"?"Shop":"Viewer",text}});
}
async function sendHeart(){
  spawnHeart();
  if(realtimeChannel) await realtimeChannel.send({type:"broadcast",event:"heart",payload:{sender:clientId}});
}
async function acquireWakeLock(){
  if(!("wakeLock" in navigator)) return;
  try{wakeLock=await navigator.wakeLock.request("screen")}catch(_){}
}
async function releaseWakeLock(){try{await wakeLock?.release()}catch(_){}wakeLock=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&joinedWanted) acquireWakeLock()});

function qualityLabel(q){
  if(q===1)return["Excellent","#35d07f"];
  if(q===2)return["Good","#75d45b"];
  if(q===3)return["Fair","#e8be3e"];
  if(q===4)return["Weak","#f18438"];
  if(q===5)return["Very weak","#ef4444"];
  if(q===6)return["Disconnected","#dc2626"];
  return["Checking…","#888"];
}
async function adaptHostQuality(q){
  if(role!=="host"||!localVideoTrack) return;
  const now=Date.now();
  if(now-lastQualityChange<8000) return;
  try{
    if(q>=4&&qualityProfile!=="480p_2"){
      await localVideoTrack.setEncoderConfiguration("480p_2");
      qualityProfile="480p_2";lastQualityChange=now;els.qualityBtnText.textContent="Auto 480p";
    }else if(q>0&&q<=2&&qualityProfile!=="720p_3"){
      await localVideoTrack.setEncoderConfiguration("720p_3");
      qualityProfile="720p_3";lastQualityChange=now;els.qualityBtnText.textContent="Auto 720p";
    }
  }catch(_){}
}
async function makeClient(nextRole){
  role=nextRole;
  client=AgoraRTC.createClient({mode:"live",codec:"vp8"});
  await client.setClientRole(nextRole);

  client.on("user-published",async(user,mediaType)=>{
    try{
      await client.subscribe(user,mediaType);
      if(mediaType==="video"){
        els.remote.innerHTML="";
        user.videoTrack.play(els.remote);
        if(role==="audience") setStatus("Live video connected.");
      }
      if(mediaType==="audio") user.audioTrack.play();
    }catch(err){setStatus("Viewer error: "+(err?.message||err))}
  });
  client.on("user-unpublished",(user,mediaType)=>{
    if(mediaType==="video"&&role==="audience"){els.remote.innerHTML="";setStatus("Host paused video.");}
  });
  client.on("user-left",()=>{if(role==="audience"){els.remote.innerHTML="";setStatus("Host left the live.");}});
  client.on("network-quality",async q=>{
    const raw=role==="host"?q.uplinkNetworkQuality:q.downlinkNetworkQuality;
    const [label,color]=qualityLabel(raw);
    setQuality(label,color);
    await adaptHostQuality(raw);
  });
  client.on("connection-state-change",(cur,prev,reason)=>{
    if(cur==="RECONNECTING") setStatus("Connection weak — reconnecting automatically…");
    else if(cur==="CONNECTED"&&role==="host") setStatus("You are LIVE.");
    else if(cur==="DISCONNECTED"&&joinedWanted) setStatus("Disconnected. Agora will retry when the network returns.");
  });
  await client.join(APP_ID,CHANNEL,TOKEN,null);
}
async function tryRearCamera(){
  if(!localVideoTrack) return;
  try{
    await localVideoTrack.setDevice({facingMode:"environment"});
    cameraFacing="environment";els.local.classList.remove("mirror");
  }catch(_){}
}
async function switchCamera(){
  if(!localVideoTrack) return;
  const next=cameraFacing==="environment"?"user":"environment";
  setStatus("Switching camera…");
  try{
    await localVideoTrack.setDevice({facingMode:next});
    cameraFacing=next;
    els.local.classList.toggle("mirror",next==="user");
    setStatus("Camera switched.");
    return;
  }catch(_){}
  try{
    const cameras=await AgoraRTC.getCameras();
    if(cameras.length>1){
      const cur=localVideoTrack.getTrackLabel?localVideoTrack.getTrackLabel():"";
      let idx=cameras.findIndex(c=>c.label===cur);
      idx=(idx+1)%cameras.length;
      await localVideoTrack.setDevice(cameras[idx].deviceId);
      cameraFacing=next;
      els.local.classList.toggle("mirror",next==="user");
      setStatus("Camera switched.");
    }else setStatus("Only one camera is available to this browser.");
  }catch(err){setStatus("Camera switch not supported here.");}
}
async function toggleMic(){
  if(!localAudioTrack)return;
  micMuted=!micMuted;
  await localAudioTrack.setMuted(micMuted);
  $("muteBtn").classList.toggle("on",micMuted);
  $("muteFloat").classList.toggle("active",micMuted);
  $("muteBtn").querySelector("span:last-child").textContent=micMuted?"Unmute":"Mute";
  $("muteFloat").textContent=micMuted?"🔇":"🎤";
}
async function toggleVideo(){
  if(!localVideoTrack)return;
  videoPaused=!videoPaused;
  await localVideoTrack.setEnabled(!videoPaused);
  $("pauseBtn").classList.toggle("on",videoPaused);
  $("pauseFloat").classList.toggle("active",videoPaused);
  $("pauseBtn").querySelector("span:last-child").textContent=videoPaused?"Resume video":"Pause video";
  $("pauseFloat").textContent=videoPaused?"🚫":"🎥";
  setStatus(videoPaused?"Video paused. Audio is still live.":"Video resumed.");
}
async function toggleTorch(){
  if(!localVideoTrack)return;
  try{
    const track=localVideoTrack.getMediaStreamTrack();
    const caps=track.getCapabilities?track.getCapabilities():{};
    if(!caps.torch){setStatus("Flash/torch is not supported by this phone browser.");return;}
    torchOn=!torchOn;
    await track.applyConstraints({advanced:[{torch:torchOn}]});
    $("torchBtn").classList.toggle("on",torchOn);
    $("torchFloat").classList.toggle("active",torchOn);
    setStatus(torchOn?"Flash on.":"Flash off.");
  }catch(_){setStatus("Flash/torch is not available on this camera.");}
}
async function goFullscreen(){
  try{
    if(!document.fullscreenElement){
      if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      else if(els.stage.webkitRequestFullscreen) els.stage.webkitRequestFullscreen();
    }else if(document.exitFullscreen) await document.exitFullscreen();
  }catch(_){setStatus("Fullscreen is controlled by this browser.");}
}
async function goLive(){
  try{
    joinedWanted=true;
    setStatus("Opening camera + microphone…");
    await makeClient("host");
    await setupRealtime("host");
    [localAudioTrack,localVideoTrack]=await AgoraRTC.createMicrophoneAndCameraTracks(
      {},
      {encoderConfig:"720p_3",optimizationMode:"motion"}
    );
    await tryRearCamera();
    els.local.style.display="block";els.remote.style.display="none";
    localVideoTrack.play(els.local);
    await client.publish([localAudioTrack,localVideoTrack]);
    await acquireWakeLock();
    joinedUI("host");setStatus("You are LIVE — rear camera requested.");
  }catch(err){
    console.error(err);setStatus("Could not go live: "+(err?.message||err));await cleanup(false);
  }
}
async function watchLive(){
  try{
    joinedWanted=true;
    setStatus("Connecting to live…");
    els.local.style.display="none";els.remote.style.display="block";
    await makeClient("audience");
    await setupRealtime("audience");
    await acquireWakeLock();
    joinedUI("audience");setStatus("Connected. Waiting for host video…");
  }catch(err){
    console.error(err);setStatus("Could not watch: "+(err?.message||err));await cleanup(false);
  }
}
async function cleanup(sendEnded=true){
  if(sendEnded&&role==="host"&&realtimeChannel){
    try{await realtimeChannel.send({type:"broadcast",event:"live-ended",payload:{sender:clientId}})}catch(_){}
  }
  joinedWanted=false;
  try{localAudioTrack?.stop();localAudioTrack?.close()}catch(_){}
  try{localVideoTrack?.stop();localVideoTrack?.close()}catch(_){}
  localAudioTrack=null;localVideoTrack=null;
  try{if(client)await client.leave()}catch(_){}
  client=null;role=null;
  try{if(realtimeChannel)await supa.removeChannel(realtimeChannel)}catch(_){}
  realtimeChannel=null;
  await releaseWakeLock();
  micMuted=false;videoPaused=false;torchOn=false;qualityProfile="720p_3";
  els.local.innerHTML="";els.remote.innerHTML="";
  els.local.style.display="block";els.remote.style.display="block";
  els.chatList.innerHTML="";
  joinedUI(null);setQuality("Offline","#666");els.viewerCount.textContent="0";els.viewerCountTop.textContent="0";
  setStatus("Ready. Phone: Go Live · PC: Watch Live");
}
$("hostBtn").onclick=goLive;
$("watchBtn").onclick=watchLive;
$("switchBtn").onclick=$("switchCamFloat").onclick=switchCamera;
$("muteBtn").onclick=$("muteFloat").onclick=toggleMic;
$("pauseBtn").onclick=$("pauseFloat").onclick=toggleVideo;
$("torchBtn").onclick=$("torchFloat").onclick=toggleTorch;
$("fullscreenBtn").onclick=$("fullscreenFloat").onclick=$("fullscreenViewerBtn").onclick=goFullscreen;
$("heartHostBtn").onclick=$("heartViewerBtn").onclick=$("heartChatBtn").onclick=sendHeart;
$("endBtn").onclick=()=>cleanup(true);
$("sendBtn").onclick=sendChat;
els.chatInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendChat();}});
window.addEventListener("pagehide",()=>{try{cleanup(false)}catch(_){}});
</script>
</body>
</html>
