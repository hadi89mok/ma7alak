<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9a441">
  <title>ShoufHon — Offline</title>

  <style>
    *{box-sizing:border-box}

    html,
    body{
      margin:0;
      min-height:100%;
      background:#090503;
      color:#fff;
      font-family:Arial,"Segoe UI",sans-serif;
    }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:22px;
    }

    main{
      width:min(420px,100%);
      padding:24px;
      border:1px solid rgba(217,164,65,.48);
      border-radius:26px;
      background:
        radial-gradient(circle at 20% 0%,rgba(217,164,65,.13),transparent 38%),
        #100b08;
      text-align:center;
      box-shadow:0 18px 42px rgba(0,0,0,.42);
    }

    img{
      width:76px;
      height:76px;
      border-radius:22px;
    }

    h1{
      margin:14px 0 7px;
      font-family:Georgia,"Times New Roman",serif;
      color:#f7dfaa;
      font-size:26px;
    }

    p{
      margin:0;
      color:rgba(255,255,255,.64);
      font-size:13px;
      line-height:1.5;
    }

    button{
      margin-top:18px;
      min-height:42px;
      padding:0 18px;
      border:0;
      border-radius:12px;
      background:linear-gradient(135deg,#f3d07e,#d9a441);
      color:#1a1008;
      font-weight:900;
      cursor:pointer;
    }
  </style>
</head>

<body>
  <main>
    <img src="/pwa-icon-192.svg" alt="">
    <h1>ShoufHon</h1>
    <p>You're offline right now. Reconnect to load fresh Stories, Reels, messages and Live Offers.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
